name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # No secrets or network needed: GitHub and token verification are mocked (see tests/)
      - run: uv run pytest
